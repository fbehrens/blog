<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVA ADEMI — Saal</title>
<style>
:root{
  --wand:#f4f2ed; --wand-2:#eae7e0; --tinte:#16130f; --grau:#8d8madd; --grau:#8a857c;
  --rot:#9c4b3c; --linie:#d8d4cb;
  --sans:"Helvetica Neue",Inter,"Univers",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--wand);color:var(--tinte);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block}
a{color:inherit;text-decoration:none}

/* Wandlicht + Bodenlinie */
.licht{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,#fffefb 0%, var(--wand) 38%, var(--wand-2) 100%)}
.boden{position:fixed;left:0;right:0;bottom:8vh;height:1px;background:var(--linie);z-index:1}

/* Kopf */
header{position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;justify-content:space-between;align-items:center;
  padding:1.7rem 2.4rem;font-size:.6rem;letter-spacing:.34em;text-transform:uppercase}
header::before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(248,247,243,.96),rgba(248,247,243,0))}
header .marke{font-weight:600;text-indent:.34em}
header .ort{color:var(--grau)}

/* Der Saal: horizontale Spur */
#spur{position:fixed;top:0;left:0;z-index:2;height:100vh;display:flex;align-items:flex-end;
  will-change:transform}
#bahn{display:flex;align-items:flex-end;gap:clamp(4rem,9vw,13rem);
  padding:0 max(8vw,4rem) 23vh;height:100%}
.werk .rahmen img{
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%)}

/* Saal-Titel als Wandtext */
.wandtext{align-self:center;min-width:52vw;max-width:60vw;padding:12vh 0 12vh}
.wandtext .nr{font-size:.6rem;letter-spacing:.36em;color:var(--rot);margin-bottom:2.2rem}
.wandtext h1{font-size:clamp(3rem,11vw,10rem);font-weight:200;letter-spacing:-.02em;line-height:.92}
.wandtext h2{font-size:clamp(2rem,6.5vw,5rem);font-weight:200;letter-spacing:-.01em;line-height:1}
.wandtext p{margin-top:2rem;max-width:46ch;font-size:clamp(.82rem,1.1vw,.98rem);
  line-height:2;color:#3a352e;font-weight:300}
.wandtext .hinweis{margin-top:3.4rem;font-size:.58rem;letter-spacing:.34em;
  text-transform:uppercase;color:var(--grau);display:flex;align-items:center;gap:.9rem}
.pfeil{display:inline-block;width:3.4rem;height:1px;background:var(--grau);position:relative;
  animation:schieb 2.6s ease-in-out infinite}
@keyframes schieb{0%,100%{transform:translateX(0)}50%{transform:translateX(9px)}}

/* Werk an der Wand */
.werk{position:relative;flex:0 0 auto;cursor:zoom-in}
.werk .rahmen{overflow:hidden}
.werk img{width:auto;transition:transform 1.4s cubic-bezier(.16,.84,.24,1), filter 1.2s;
  transform:scale(1.04);filter:saturate(.96)}
.werk:hover img{transform:scale(1);filter:saturate(1)}
/* Hängung: Oberkanten variieren, Blickachse bleibt */
.g-1 img{height:clamp(180px,26vh,290px)}
.g-2 img{height:clamp(240px,38vh,430px)}
.g-3 img{height:clamp(300px,50vh,570px)}
.hoch{margin-bottom:clamp(2rem,7vh,6rem)}

/* Wandschild */
.schild{margin-top:1.5rem;border-left:1px solid var(--tinte);padding-left:.9rem;max-width:22ch;
  opacity:0;transform:translateY(6px);transition:.8s}
.werk.sicht .schild{opacity:1;transform:none}
.schild .t{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.schild .en{font-weight:400;color:var(--grau)}
.schild .m{font-size:.66rem;letter-spacing:.06em;color:var(--grau);line-height:1.8;margin-top:.35rem}

/* Grundriss / Fortschritt */
.grundriss{position:fixed;left:2.4rem;right:2.4rem;bottom:1.5rem;z-index:20;
  display:flex;align-items:center;gap:1.2rem;
  font-size:.56rem;letter-spacing:.3em;text-transform:uppercase;color:var(--grau)}
.gleis{flex:1;height:1px;background:var(--linie);position:relative}
.gleis i{position:absolute;left:0;top:-1px;height:3px;background:var(--rot);width:0;transition:width .25s}
.marken{position:absolute;inset:0;display:flex;justify-content:space-between}
.marken span{width:1px;height:7px;background:var(--linie);margin-top:-3px}

/* Nahsicht */
#nah{position:fixed;inset:0;z-index:40;background:rgba(244,242,237,.985);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8rem;
  opacity:0;visibility:hidden;transition:.5s;cursor:zoom-out;padding:8vh 6vw}
#nah.auf{opacity:1;visibility:visible}
#nah img{max-height:66vh;width:auto}
#nah .schild{opacity:1;transform:none;text-align:left}
@media(max-width:820px){
  body{overflow:auto}
  #spur{position:static;height:auto;display:block;transform:none!important}
  #bahn{flex-direction:column;align-items:flex-start;height:auto;padding:22vh 8vw 18vh;gap:14vh}
  .boden,.grundriss{display:none}
  .wandtext{max-width:100%;min-width:0;padding:6vh 0}
  header{padding:1.1rem 1.2rem;font-size:.5rem;letter-spacing:.2em}
  .werk img{max-width:100%;height:auto!important}
  #nah{display:none!important}
  .werk{cursor:default}
}
</style>
</head>
<body>
<div class="licht"></div><div class="boden"></div>

<header>
  <span class="marke">Eva Ademi</span>
  <span class="ort">Saal — Skulptur, Plastik und Assemblage</span>
  <a href="../index.html" style="font-size:.6rem;letter-spacing:.34em;text-transform:uppercase">Index</a>
</header>

<div id="spur"><div id="bahn"></div></div>

<div class="grundriss">
  <span id="pos">01</span>
  <div class="gleis"><i id="fort"></i><div class="marken" id="marken"></div></div>
  <span id="ges"></span>
</div>

<div id="nah"><img id="n-bild" alt=""><div class="schild"><div class="t" id="n-t"></div><div class="m" id="n-m"></div></div></div>

<script src="../assets/werke.js"></script>
<script>
const W=window.WERKE,G=window.GRUPPEN,T=window.TEXTE;
const bahn=document.getElementById("bahn");
const groesse=["g-2","g-3","g-1","g-2","g-1","g-3","g-2","g-1"];
let gi=0;

let html=`<div class="wandtext">
  <div class="nr">Eva Ademi — Bildhauerin</div>
  <h1>Werden<br>und<br>Vergehen</h1>
  <p>${T.intro}</p>
  <div class="hinweis"><span class="pfeil"></span> Durch den Saal scrollen</div>
</div>`;

G.forEach(gr=>{
  const teile=W.filter(w=>w.g===gr.g); if(!teile.length)return;
  html+=`<div class="wandtext"><div class="nr">Saal ${gr.r}</div><h2>${gr.n}</h2><p>${gr.s}</p></div>`;
  teile.forEach(w=>{
    const i=W.indexOf(w);
    html+=`<figure class="werk ${groesse[gi++%groesse.length]} ${gi%3===0?"hoch":""}" data-i="${i}">
      <div class="rahmen"><img src="../assets/werke/${w.f}" alt="${w.t}" loading="lazy"></div>
      <figcaption class="schild"><div class="t">${w.t}${w.en?` <span class="en">(${w.en})</span>`:""}</div>
      <div class="m">${w.d||"—"}<br>${w.gruppe} · ${w.j||"o. J."}</div></figcaption>
    </figure>`;
  });
});

html+=`<div class="wandtext">
  <div class="nr">Text</div><h2>Zur Arbeit</h2>
  ${T.absatz.map(p=>`<p>${p}</p>`).join("")}
  <p style="color:#16130f">${T.schluss}</p>
</div>
<div class="wandtext">
  <div class="nr">Vita</div><h2>Eva Ademi</h2>
  ${T.vita.map(([a,b])=>`<p><strong style="letter-spacing:.14em">${a}</strong> &nbsp; ${b}</p>`).join("")}
  <div class="hinweis" style="display:block;line-height:2.6">${T.ausstellungen.join(" · ")}</div>
</div>
<div class="wandtext">
  <div class="nr">Besuch</div><h2>Atelier<br>Bonn-Ramersdorf</h2>
  <p>Kursangebot 2026 — Bildhauerkurse in Speckstein und Wachs. Termine nach Vereinbarung.</p>
  <div class="hinweis">Kontakt · Termine · Anfahrt · Impressum · Datenschutz</div>
</div>`;
bahn.innerHTML=html;

/* Vertikales Scrollen → horizontale Bewegung */
const spur=document.getElementById("spur");
let ziel=0,ist=0,max=0;
function messen(){ max=Math.max(0,bahn.scrollWidth-innerWidth);
  document.body.style.height=(max+innerHeight)+"px"; }
function schleife(){
  ziel=Math.min(scrollY,max);
  ist+=(ziel-ist)*.085;
  spur.style.transform=`translate3d(${-ist.toFixed(2)}px,0,0)`;
  const p=max?ist/max:0;
  fort.style.width=(p*100)+"%";
  pos.textContent=String(Math.min(W.length,Math.round(p*W.length)+1)).padStart(2,"0");
  requestAnimationFrame(schleife);
}
if(innerWidth>820){
  addEventListener("load",messen); addEventListener("resize",messen); messen(); schleife();
}
ges.textContent=String(W.length).padStart(2,"0");
marken.innerHTML=G.map(()=>"<span></span>").join("");

/* Schilder erscheinen */
const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle("sicht",e.isIntersecting)),
  {root:null,threshold:.35});
document.querySelectorAll(".werk").forEach(f=>io.observe(f));

/* Nahsicht */
const nah=document.getElementById("nah"), $=id=>document.getElementById(id);
document.querySelectorAll(".werk").forEach(f=>f.onclick=()=>{
  const w=W[+f.dataset.i];
  $("n-bild").src="../assets/werke/"+w.f; $("n-bild").alt=w.t;
  $("n-t").textContent=w.t+(w.en?" ("+w.en+")":"");
  $("n-m").innerHTML=(w.d||"—")+"<br>"+w.gruppe+" · "+(w.j||"o. J.");
  nah.classList.add("auf");
});
nah.onclick=()=>nah.classList.remove("auf");
addEventListener("keydown",e=>e.key==="Escape"&&nah.classList.remove("auf"));
</script>
</body>
</html>
