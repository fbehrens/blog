  - heading "The same thing, opencode-shaped" [level=2] [ref=e43]
  - paragraph [ref=e44]:
    - text: Compare
    - code [ref=e45]: opencode/src/skill/discovery.ts
    - text: ". The pattern, applied to your skills module:"
  - code [ref=e47]: "// src/skills.ts import { Context, Effect, Layer, FileSystem } from \"effect\" // 1. INTERFACE — the surface other code depends on. export interface Interface { readonly scan: (rootDir: string) => Effect.Effect<ScanResult, DuplicateSkillsError> } // 2. SERVICE TAG — the lookup key + the type \"I need Skills\". export class Skills extends Context.Service<Skills, Interface>()(\"msk/Skills\") {} // 3. LAYER — build it once; deps (FileSystem) live in the LAYER's type, not callers'. export const layer: Layer.Layer<Skills, never, FileSystem.FileSystem> = Layer.effect( Skills, Effect.gen(function* () { const fs = yield* FileSystem.FileSystem // acquire deps ONCE, here const scan = Effect.fn(\"Skills.scan\")(function* (rootDir: string) { // ...your existing logic, using the captured `fs`... return { entries, skillsDirs } }) return Skills.of({ scan }) // the implementation }), ) // defaultLayer = layer with its dependencies already satisfied → plug-and-play. export const defaultLayer = layer.pipe(Layer.provide(BunFileSystem.layer))"
  - paragraph [ref=e48]:
