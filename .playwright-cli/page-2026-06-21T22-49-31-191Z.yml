    - code [ref=e49]: FileSystem
    - text: in its type — it just asks for
    - code [ref=e50]: Skills
    - text: ":"
  - code [ref=e52]: "const program = Effect.gen(function* () { const skills = yield* Skills // requirement: Skills, not FileSystem return yield* skills.scan(rootDir) })"
