# Setup required before this workflow runs:
#
# 1. Cloudflare API Token
#    - dash.cloudflare.com → My Profile → API Tokens → Create Token
#    - Use template "Edit Cloudflare Workers" or create custom with:
#      · Account / Workers Scripts: Edit
#      · Account / D1: Edit
#      · Zone / Workers Routes: Edit (for aufb.de)
#    - Copy the token value (shown once)
#
# 2. GitHub repository secrets
#    - github.com → repo → Settings → Secrets and variables → Actions → New repository secret
#    - CLOUDFLARE_API_TOKEN  ← paste the token from step 1
#    - NEWSLETTER_SECRET     ← any strong random string; must match the NEWSLETTER_SECRET
#                               Worker secret set via: wrangler secret put NEWSLETTER_SECRET

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Workers
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Extract latest post metadata
        id: post
        run: |
          node - <<'EOF'
          const fs = require("fs")
          const path = require("path")

          const dir = "src/content/posts"
          const posts = fs.readdirSync(dir)
            .map(slug => {
              const file = path.join(dir, slug, "index.md")
              if (!fs.existsSync(file)) return null
              const raw = fs.readFileSync(file, "utf8")
              const m = raw.match(/^---\n([\s\S]*?)\n---/)
              if (!m) return null
              const fm = m[1]
              const title = fm.match(/^title:\s*["']?(.*?)["']?\s*$/m)?.[1] ?? ""
              const description = fm.match(/^description:\s*["']?(.*?)["']?\s*$/m)?.[1] ?? ""
              const date = fm.match(/^date:\s*(.+)$/m)?.[1]?.trim() ?? ""
              const draft = fm.match(/^draft:\s*(.+)$/m)?.[1]?.trim() === "true"
              return { slug, title, description, date, draft }
            })
            .filter(p => p && !p.draft)
            .sort((a, b) => b.date.localeCompare(a.date))

          const latest = posts[0]
          if (!latest) { console.log("No posts found"); process.exit(0) }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `title=${latest.title}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `excerpt=${latest.description}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=https://www.aufb.de/posts/${latest.slug}\n`)
          EOF

      - name: Send newsletter
        if: steps.post.outputs.title != ''
        run: |
          curl -sf -X POST https://www.aufb.de/api/send-newsletter \
            -H "Authorization: Bearer ${{ secrets.NEWSLETTER_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{
              "title": ${{ toJSON(steps.post.outputs.title) }},
              "excerpt": ${{ toJSON(steps.post.outputs.excerpt) }},
              "url": ${{ toJSON(steps.post.outputs.url) }}
            }'
